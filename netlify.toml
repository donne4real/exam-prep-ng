# Netlify build settings. The Vite base path is / here (NETLIFY=true is set
# in the build environment; see vite.config.ts), unlike GitHub Pages where
# the app lives under /exam-prep-ng/.

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: serve index.html for client-side routes while still serving
# real files (data banks, assets, service worker) directly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
